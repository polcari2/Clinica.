server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:38081/realms/clinicadent/protocol/openid-connect/certs
  datasource:
    url: jdbc:oracle:thin:@localhost:1522/FREEPDB1
    username: CLINICADENT_APP
    password: 123456
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: CLINICADENT_APP
        format_sql: true
  data:
    redis:
      host: localhost
      port: 36379

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

clinicadent:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:4300